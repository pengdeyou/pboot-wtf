[project]
name = "pboot-wtf"
version = "1.0.0"
description = "Form rendering, validation, and CSRF protection for Pboot with WTForms."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
maintainers = [{name = "pboot-org"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "pboot>=3.2.0",
    "Werkzeug>=3.0",
    "WTForms>=3.0",
    "itsdangerous>=2.1.2",
]

[project.urls]
Documentation = "https://flask-wtf.readthedocs.io/"
Changes = "https://flask-wtf.readthedocs.io/changes/"
"Source Code" = "https://github.com/pallets-eco/flask-wtf/"
"Issue Tracker" = "https://github.com/pallets-eco/flask-wtf/issues/"
Chat = "https://discord.gg/pallets"

[project.optional-dependencies]
email = ["email_validator"]

[dependency-groups]
test = [
    "pytest>=8",
]
test-babel = [
    "Flask-Babel",
    "flask-reuploaded",
]
docs = [
    "Pallets-Sphinx-Themes",
    "Sphinx",
    "sphinx-issues",
    "sphinxcontrib-log-cabinet",
]
dev = [
    "pre-commit",
    "tox",
    "tox-uv",
]

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "pboot_wtf"

[tool.flit.sdist]
include = [
    "docs/",
    "tests/",
    "examples/",
    "CHANGES.rst",
    "CONTRIBUTING.rst",
    "tox.ini",
]
exclude = [
    "docs/_build/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["pboot_wtf", "tests"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError:",
]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
